
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.devtools.restart.enabled=false

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

# 소셜 로그인 성공 후 돌아갈 프론트 주소 (배포 도메인)
app.frontend-base-url=${FRONTEND_BASE_URL}

# 소셜 로그인 client-id/secret. CD 워크플로우가 GitHub Secrets 값을 환경변수로 주입한다.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}

# 문자 인증(NHN 클라우드 SENS) - 이메일 찾기 등 전화번호 인증에 사용.
# 소셜 로그인 키와 달리 부가 기능이라, 배포 시크릿을 아직 안 넣었어도 배포 자체는 막히지 않게 기본값을 빈 문자열로 둔다.
# (비어 있으면 SmsService가 실제 발송 대신 로그로만 남긴다)
sens.service-id=${SENS_SERVICE_ID:}
sens.access-key=${SENS_ACCESS_KEY:}
sens.secret-key=${SENS_SECRET_KEY:}
sens.sender-phone=${SENS_SENDER_PHONE:}
