
spring.profiles.active=local
spring.application.name=brentversal
server.port=9022
# nginx(리버스 프록시) 뒤에서 실행될 때, 스프링이 X-Forwarded-Proto/Host 헤더를 신뢰하고
# 그걸로 실제 외부 주소({baseUrl})를 계산하게 한다. 이게 없으면 배포 환경에서도
# {baseUrl}이 항상 http://localhost:9022로 계산되어 소셜 로그인 redirect-uri가 틀어진다.
server.forward-headers-strategy=framework

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/rentversal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=mysql

spring.devtools.restart.enabled=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# data.sql 실행 설정 (resources/data.sql 의 예시 데이터를 넣기 위한 설정)
# mode=always : MySQL 처럼 외부 DB 를 쓸 때도 data.sql 을 실행한다 (기본값은 H2 같은 내장 DB 일 때만 실행)
# defer-datasource-initialization=true : Hibernate 가 테이블을 만든 다음에 data.sql 을 실행한다
#                                        (이 설정이 없으면 테이블이 없는 상태에서 INSERT 를 시도해 실패한다)
# encoding=UTF-8 : data.sql 안의 한글이 깨지지 않도록 지정
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
# 키 파일 경로: 공용 파일에는 개인 절대경로를 두지 않는다.
# 기본값은 실행 위치(working dir = brentversal/) 기준 상대경로다.
# - 로컬에서 경로가 다르면 각자 application-local.properties 에서 덮어쓴다.
# - 운영(prod)은 CD 워크플로우가 JWT_PRIVATE_KEY/JWT_PUBLIC_KEY(키 내용)를 주입하므로 이 경로는 실제로 읽지 않는다.
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:secrets/jwt-private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:secrets/jwt-public.pem}

jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

###########################################
# 소셜 로그인 공통 설정: local/prod 어느 쪽이든 값이 똑같은 것들만 여기에 둔다.
# client-id/client-secret, app.frontend-base-url처럼 환경마다 값이 달라지는 건
# application-local.properties(.env에서 읽음) / application-prod.properties(배포 시크릿에서 읽음)로 옮겼다.

spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.scope=name,email

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response


server.servlet.session.timeout=120m
logging.level.org.springframework.security=DEBUG

# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

