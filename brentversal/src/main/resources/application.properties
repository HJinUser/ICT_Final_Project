
spring.profiles.active=local
spring.application.name=brentversal
server.port=9022

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/rentversal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=mysql

spring.devtools.restart.enabled=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=update

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# data.sql 실행 설정 (resources/data.sql 의 예시 데이터를 넣기 위한 설정)
# mode=always : MySQL 처럼 외부 DB 를 쓸 때도 data.sql 을 실행한다 (기본값은 H2 같은 내장 DB 일 때만 실행)
# defer-datasource-initialization=true : Hibernate 가 테이블을 만든 다음에 data.sql 을 실행한다
#                                        (이 설정이 없으면 테이블이 없는 상태에서 INSERT 를 시도해 실패한다)
# encoding=UTF-8 : data.sql 안의 한글이 깨지지 않도록 지정
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
# 키 파일 경로: 공용 파일에는 개인 절대경로를 두지 않는다.
# 기본값은 실행 위치(working dir = brentversal/) 기준 상대경로다.
# - 로컬에서 경로가 다르면 각자 application-local.properties 에서 덮어쓴다.
# - 운영(prod)은 CD 워크플로우가 JWT_PRIVATE_KEY/JWT_PUBLIC_KEY(키 내용)를 주입하므로 이 경로는 실제로 읽지 않는다.
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:secrets/jwt-private.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:secrets/jwt-public.pem}

jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}


server.servlet.session.timeout=120m
logging.level.org.springframework.security=DEBUG

# spring.servlet.multipart.max-file-size=10MB
# spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

