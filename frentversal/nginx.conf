# ALB가 HTTPS 리스너에서 이 컨테이너(HTTP 80)로 넘길 때 X-Forwarded-Proto: https를 실어서 보낸다.
# 이 값을 아래에서 그대로 살려 써야 한다 — $scheme으로 덮어쓰면 ALB->EC2 구간이 평문 HTTP라
# 무조건 "http"가 되어, 스프링이 {baseUrl}을 http://로 잘못 계산해 소셜 로그인 redirect_uri가 깨진다.
# (ALB 없이 로컬 등에서 직접 접근해 헤더가 없는 경우에만 $scheme으로 대체한다.)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # React 빌드 결과물이 있는 위치
    root /usr/share/nginx/html;
    index index.html;
    
    # 업로드 최대 용량
    client_max_body_size 120M;

    # 1) API 요청: /api로 시작하면 백엔드(9000)로 넘김
    #    proxy_pass 끝의 / 가 핵심 → /api를 떼고 넘김
    #    예: /api/product/list → 백엔드는 /product/list 로 받음
    location /api/ {
        proxy_pass http://localhost:9022/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 2) 이미지 요청: /images로 시작하면 백엔드로 넘김
    #    (백엔드 WebConfig가 /images/** 를 처리함. S3 전환 전까지)
    location /images/ {
        proxy_pass http://localhost:9022/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 업로드 파일: /files로 시작하면 백엔드로 넘김 (로컬 저장 모드일 때)
    location /files/ {
        proxy_pass http://localhost:9022/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 소셜 로그인 콜백: 카카오/구글/네이버가 로그인 완료 후 브라우저를 이 경로로 직접 돌려보낸다.
    # (프론트가 보내는 요청이 아니라 소셜 제공자가 등록된 redirect-uri로 보내는 요청이라 /api를 안 거침)
    # X-Forwarded-Proto를 반드시 넘겨야 스프링이 {baseUrl}을 https://실제도메인으로 정확히 계산한다.
    location /login/oauth2/ {
        proxy_pass http://localhost:9022/login/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 3) 그 외 모든 요청: React 화면으로
    #    React Router 때문에 새로고침해도 404 안 나게 index.html로 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}