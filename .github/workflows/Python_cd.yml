# GitHub Actions 화면에 표시될 워크플로우/단계 이름 지정함
name: Python ML CD - Deploy to ML EC2

# 워크플로우가 실행될 GitHub 이벤트 조건 정의함
on:
  workflow_run:
    workflows: ["Python ML CI - Build and Push"]
    types:
      - completed

# 실제로 실행할 작업 묶음 정의함
jobs:
  deploy:
    # GitHub Actions Runner 운영체제 지정함
    runs-on: ubuntu-latest

    # 앞선 작업 결과 등에 따라 실행 여부 제한함
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # Job 안에서 순서대로 실행할 단계 정의함
    steps:
      # GitHub Actions 화면에 표시될 워크플로우/단계 이름 지정함
      - name: Deploy ML to EC2

        # GitHub Marketplace Action을 가져와 사용함
        uses: appleboy/ssh-action@v1.0.3

        # 사용하는 Action에 전달할 입력값 정의함
        with:
          # SSH로 접속할 대상 ML EC2 주소 지정함
          host: ${{ secrets.ML_EC2_HOST }}

          # EC2 SSH 접속 계정 지정함
          username: ubuntu

          # ML EC2도 기존 EC2와 동일한 Key Pair를 사용하므로
          # 기존 EC2_KEY Secret을 그대로 재사용함
          key: ${{ secrets.EC2_KEY }}

          # EC2에 접속한 뒤 실행할 배포 명령 묶음 정의함
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            sudo docker pull "${{ secrets.ML_DOCKER_IMAGE }}"

            sudo docker rm -f "${{ secrets.ML_DOCKER_CONTAINER }}" || true

            # AI 챗봇에 필요한 값 두 가지를 환경변수로 넣어 준다.
            #
            # OPENAI_API_KEY  : 없으면 챗봇 요청만 503으로 거절된다. 나머지 ML 기능은 그대로 뜬다.
            # SPRING_BASE_URL : 챗봇이 매물을 찾을 때 되돌아가서 부를 메인 EC2 주소다.
            #                   ML EC2에서 메인 EC2 9022 포트로 나가는 길이 보안그룹에 열려 있어야 한다.
            #                   (기존 방향인 메인 -> ML 8000 과 반대 방향이라 따로 열어야 한다)
            sudo docker run -d \
              --name "${{ secrets.ML_DOCKER_CONTAINER }}" \
              --network host \
              --restart unless-stopped \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e SPRING_BASE_URL="http://${{ secrets.MAIN_EC2_PRIVATE_IP }}:9022" \
              "${{ secrets.ML_DOCKER_IMAGE }}"

            sudo docker image prune -f