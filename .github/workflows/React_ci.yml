name: React CI - Build and Push

# main에 push되고, frontend폴더가 바뀔 때만 실행
on:
  push:
    branches:
      - main
    paths:
      - 'frentversal/**'
      - '.github/workflows/React_ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 프론트 폴더(frentversal)의 ReactDockerfile로 이미지 빌드
      # 카카오맵 JavaScript 키는 GitHub Secret에서 받아 빌드 시 전달
      - name: Build Docker Image
        run: |
          docker build \
            --build-arg VITE_KAKAO_MAP_KEY="${{ secrets.VITE_KAKAO_MAP_KEY }}" \
            -t "${{ secrets.FRONT_DOCKER_IMAGE }}" \
            -f ./frentversal/ReactDockerfile \
            ./frentversal

      - name: Push Docker Image
        run: docker push "${{ secrets.FRONT_DOCKER_IMAGE }}"